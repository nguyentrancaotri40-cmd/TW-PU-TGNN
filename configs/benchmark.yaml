benchmark:
  seeds: [42, 43, 44]
  # Directory names under data/processed/. Each one carries its own W / delay setting.
  # 72 runs = 4 losses x 3 delay x 2 tau x 3 seeds needs SIX directories; only two are known to exist.
  delays: [delay_low, delay_high]
  backbone: sage
  # lambda of w = 1 - exp(-lambda * age_days). MUST be filled per delay (decision C); null -> the runner refuses.
  lam_by_delay:
    delay_low: 0.324      # median ~2.14 d
    delay_high: 0.080     # median ~8.68 d
  groups:                       # run order = group order, then delay -> loss -> seed
    oracle:
      enabled: true
      oracle: true              # NaiveBCE on y_true; needed for Recovery Ratio
    main:
      enabled: true
      losses: [naive_bce, maturity_mask, delay_ipw, tw_nndf]    # naive_bce = A0
      lp: false
      use_temporal: true
    lp_naive:                   # feature-level ATLAS-style LP features + naive_bce (+18 runs in the 90 matrix)
      enabled: false
      losses: [naive_bce]
      lp: true
      use_temporal: true
    ablation_nogru:             # GRU ablation; has its own A0 (naive_bce) for the comparison
      enabled: false
      losses: [naive_bce, tw_nndf]
      lp: false
      use_temporal: false
    prior_sensitivity:          # needs the `prior` diff in run_one; exploratory
      enabled: false
      losses: [tw_nndf]
      lp: false
      use_temporal: true
      # true fraud rate inside U measured on train (1.39% / 1.82%). The label "oracle prior" is not deployable.
      # KHÔNG CHẮC: check that TimeWindowNNDFLoss defines `prior` on the same population as these rates.
      priors_by_delay: {delay_high: [0.0139], delay_low: [0.0182]}