# configs/delay_very_high.yaml -- VERY LONG label delay (about 1.5 months). Overlay on base.yaml.
# Simulation assumptions, not estimates from IEEE-CIS.
# Truncated Weibull (shape 1.3, scale 27, cap 45): median ~17.3 d at the reference amount
# -> lam_by_delay = ln2 / 17.27 ~ 0.040 (hand calculation; tests/test_v15_preflight_fixes.py re-derives it).
# W = cap = 45 keeps W >= cap, so N holds no hidden fraud.
delay:
  mode: weibull
  maturity_window_days: 45
  params:
    shape: 1.3
    scale_days: 27.0
    amount_exponent: 0.3
    amount_ref: null
    cap_days: 45
    min_delay_hours: 1.0
    seed: 42